<div class="layout" [class.collapsed]="sidebarCollapsed">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo">
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="rgba(99,102,241,0.2)"/>
          <path d="M8 16C8 11.58 11.58 8 16 8V24C11.58 24 8 20.42 8 16Z" fill="#6366f1"/>
          <path d="M16 8C20.42 8 24 11.58 24 16C24 20.42 20.42 24 16 24V8Z" fill="rgba(99,102,241,0.5)"/>
        </svg>
      </div>
      <div class="brand-info" *ngIf="!sidebarCollapsed">
        <span class="brand-title">IDSS</span>
        <span class="brand-sub">Natation</span>
      </div>
      <button class="collapse-btn" (click)="toggleSidebar()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline *ngIf="sidebarCollapsed" points="9 18 15 12 9 6"/>
          <polyline *ngIf="!sidebarCollapsed" points="15 18 9 12 15 6"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section" *ngIf="!sidebarCollapsed">Menu Principal</div>
      <a *ngFor="let item of menuItems"
         class="nav-link"
         [class.active]="isActive(item.route)"
         (click)="navigate(item.route)">
        <span class="nav-icon" [innerHTML]="item.icon"></span>
        <span class="nav-label" *ngIf="!sidebarCollapsed">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge && item.badge > 0 && !sidebarCollapsed">
          {{ item.badge }}
        </span>
      </a>
    </nav>

    <!-- Theme Toggle -->
    <div class="theme-toggle-wrapper" *ngIf="!sidebarCollapsed">
      <button class="theme-toggle-btn" (click)="toggleDarkMode()">
        <svg *ngIf="darkMode" class="icon-animated icon-spin-slow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg *ngIf="!darkMode" class="icon-animated" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span class="theme-label">{{ darkMode ? 'Mode clair' : 'Mode sombre' }}</span>
      </button>
    </div>
    <div class="theme-toggle-wrapper" *ngIf="sidebarCollapsed">
      <button class="theme-toggle-btn compact" (click)="toggleDarkMode()" [title]="darkMode ? 'Mode clair' : 'Mode sombre'">
        <svg *ngIf="darkMode" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
        </svg>
        <svg *ngIf="!darkMode" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-footer">
      <div class="user-card" (click)="navigate('/settings')">
        <div class="user-avatar">
          <img *ngIf="currentUser?.imageprofile" [src]="'http://localhost:3300' + currentUser?.imageprofile" class="user-avatar-img" />
          <span *ngIf="!currentUser?.imageprofile">{{ getUserInitials() }}</span>
        </div>
        <div class="user-info" *ngIf="!sidebarCollapsed">
          <span class="user-name">{{ currentUser?.prenom }} {{ currentUser?.nom }}</span>
          <span class="user-role">{{ getRoleBadge() }}</span>
        </div>
        <svg class="logout-icon-svg" *ngIf="!sidebarCollapsed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             title="Paramètres" (click)="$event.stopPropagation(); navigate('/settings')">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </div>
      <button class="logout-btn" (click)="logout()" *ngIf="!sidebarCollapsed">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
