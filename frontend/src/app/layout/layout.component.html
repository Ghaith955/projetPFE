<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-top-brand">
      <div class="brand-text" aria-label="IDSS">idss</div>
    </div>

    <nav class="sidebar-nav">
      <button
        type="button"
        *ngFor="let item of menuItems"
        class="nav-link"
        [class.active]="isActive(item.route)"
        [attr.aria-current]="isActive(item.route) ? 'page' : null"
        [attr.aria-label]="item.labelKey | translate"
        (click)="navigate(item.route)"
      >
        <span class="nav-icon" aria-hidden="true" [innerHTML]="item.icon"></span>
        <span class="nav-label">{{ item.labelKey | translate }}</span>
        <span class="nav-badge" *ngIf="item.badge && item.badge > 0">{{ item.badge }}</span>
      </button>
    </nav>

    <div class="sidebar-controls">
      <div class="control-group">
        <span class="control-label">{{ 'sidebar.language' | translate }}</span>
        <div class="lang-select-wrap">
          <select
            class="lang-select"
            [value]="currentLang"
            (change)="setLanguage($any($event.target).value)"
            [attr.aria-label]="'sidebar.language' | translate"
          >
            <option *ngFor="let lang of languages" [value]="lang.code">
              {{ lang.label }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <!-- User Avatar -->
    <div class="sidebar-user" (click)="logout()">
      <div class="sidebar-avatar">
        <img *ngIf="currentUser?.imageprofile" [src]="'http://localhost:3300' + currentUser?.imageprofile" alt="" />
        <span *ngIf="!currentUser?.imageprofile">{{ getUserInitials() }}</span>
      </div>
      <span class="sidebar-user-name">{{ currentUser?.prenom }}</span>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-shell">
      <router-outlet></router-outlet>
    </div>
  </main>

  <app-chatbot></app-chatbot>
</div>
