<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-top-brand">
      <div class="brand-text" aria-label="IDSS">idss</div>
    </div>

    <nav class="sidebar-nav">
      <button
        type="button"
        *ngFor="let item of menuItems"
        class="nav-link"
        [class.active]="isActive(item.route)"
        [attr.aria-current]="isActive(item.route) ? 'page' : null"
        [attr.aria-label]="item.labelKey | translate"
        (click)="navigate(item.route)"
      >
        <span class="nav-icon" aria-hidden="true" [innerHTML]="item.icon"></span>
        <span class="nav-label">{{ item.labelKey | translate }}</span>
        <span class="nav-badge" *ngIf="item.badge && item.badge > 0">{{ item.badge }}</span>
      </button>
    </nav>

    <div class="sidebar-controls">
      <div class="control-group">
        <span class="control-label">{{ 'sidebar.language' | translate }}</span>
        <div class="lang-select-wrap">
          <select
            class="lang-select"
            [value]="currentLang"
            (change)="setLanguage($any($event.target).value)"
            [attr.aria-label]="'sidebar.language' | translate"
          >
            <option *ngFor="let lang of languages" [value]="lang.code">
              {{ lang.label }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <!-- User Avatar -->
    <div class="sidebar-user" (click)="logout()">
      <div class="sidebar-avatar">
        <img *ngIf="currentUser?.imageprofile" [src]="'http://localhost:3300' + currentUser?.imageprofile" alt="" />
        <span *ngIf="!currentUser?.imageprofile">{{ getUserInitials() }}</span>
      </div>
      <span class="sidebar-user-name">{{ currentUser?.prenom }}</span>
    </div>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div class="top-actions">
        <button
          type="button"
          class="notif-btn"
          (click)="toggleNotifications()"
          [attr.aria-expanded]="showNotifications"
          aria-label="Notifications"
        >
          <span class="notif-icon" aria-hidden="true" [innerHTML]="icons['bell']"></span>
          <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </button>

        <div class="notif-panel" *ngIf="showNotifications">
          <div class="notif-header">
            <span>Notifications</span>
            <button
              type="button"
              class="notif-clear"
              (click)="markAllNotificationsAsRead()"
              [disabled]="unreadCount === 0"
            >
              Tout marquer comme lu
            </button>
          </div>

          <div class="notif-loading" *ngIf="notificationsLoading">Chargement...</div>
          <div class="notif-empty" *ngIf="!notificationsLoading && notifications.length === 0">
            Aucune notification.
          </div>

          <div class="notif-list" *ngIf="!notificationsLoading && notifications.length > 0">
            <button
              type="button"
              class="notif-item"
              *ngFor="let n of notifications"
              [class.unread]="!n.isRead"
              (click)="openNotification(n)"
            >
              <span class="notif-dot" aria-hidden="true"></span>
              <div class="notif-content">
                <div class="notif-title">{{ n.title }}</div>
                <div class="notif-message">{{ n.message }}</div>
                <div class="notif-time">{{ formatNotificationDate(n.createdAt) }}</div>
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="page-shell">
      <router-outlet></router-outlet>
    </div>
  </main>

  <app-chatbot></app-chatbot>
</div>
